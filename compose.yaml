# Runs JobTrack in a container with Docker Compose. Also works pasted into TrueNAS
# (Apps > Discover Apps > Custom App > Install via YAML). See "Running in a container" in the README.
#
# No setup needed: the app creates its own secret on first start and keeps it in the volume.
services:
  jobtrack:
    image: ghcr.io/chernesk/jobtrack:latest
    restart: unless-stopped
    ports:
      - "3200:80"   # change the left number if 3200 is taken
    environment:
      # Plain HTTP on a home network. Remove this line if a reverse proxy in front adds HTTPS.
      FORCE_SSL: "false"
      # Runs the Solid Queue worker (the daily follow-up job) inside the web process.
      SOLID_QUEUE_IN_PUMA: "true"
    volumes:
      # The SQLite databases. The image runs as uid/gid 1000, so a host path must be owned by 1000:1000.
      - jobtrack_storage:/rails/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  jobtrack_storage:
