name: Publish image

# Builds the production image and pushes it to ghcr.io/<owner>/jobtrack so a container host
# (a NAS, a server) can pull it. Runs when main changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobtrack:latest
            ghcr.io/${{ github.repository_owner }}/jobtrack:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
